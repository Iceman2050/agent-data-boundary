[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-data-boundary"
version = "0.1.0"
description = "Cross-store personal-data lifecycle testing for agent systems: inventory, PII scan, data-flow map, retention validation, and per-location deletion verification (local files only)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

[project.scripts]
agent-data-boundary = "agent_data_boundary.cli:main"

[tool.setuptools.packages.find]
include = ["agent_data_boundary*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
